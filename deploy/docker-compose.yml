# TomatoDocker · 单容器 Docker 部署（应用 + SQLite，无 MySQL/Redis）
#
# 使用：
#   cp deploy/.env.example deploy/.env   # 首次部署，修改 JWT_SECRET / 管理员密码
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 或使用预构建镜像（不构建源码）：
#   docker compose -f deploy/docker-compose.release.yml up -d
#
# 应用通过挂载的 /var/run/docker.sock 管理宿主机 Docker；
# 主业务库 data/tomato.db 与 Stack 库 data/tomato-docker.db 都在 app-data 卷中。
name: tomato-docker

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
    image: ${APP_IMAGE:-tomato-docker:latest}
    container_name: tomato-docker-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      APP__APP__ENV: prod
      APP__APP__MODE: release
      APP__APP__PORT: "8080"
      # 主业务库 + Docker 域库（均 SQLite；随 app-data 卷持久化）
      APP__SQLITE__PATH: /app/data/tomato.db
      APP__DOCKER__ENABLED: "true"
      APP__DOCKER__DATABASE: /app/data/tomato-docker.db
      APP__STORAGE__TYPE: local
      # 无头 E2E 可临时设为 false；生产保持 true
      APP__AUTH__CAPTCHA_ENABLED: "${AUTH_CAPTCHA_ENABLED:-true}"
      APP__SCHEDULER__SHELL_ENABLED: "${SCHEDULER_SHELL_ENABLED:-false}"
      APP__INTEGRATION__ENABLED: "${INTEGRATION_ENABLED:-false}"
      APP__INTEGRATION__API_KEY: "${INTEGRATION_API_KEY:-}"
      APP__INTEGRATION__TENANT_ID: "1"
      # 生产务必覆盖：JWT 密钥（>=32 位随机串）与管理员初始密码
      APP__JWT__SECRET: "${JWT_SECRET:-change-me-please-use-32chars-random-secret}"
      APP__JWT__SECRET_PREVIOUS: ""
      APP__APP__ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Admin@123456}"
    volumes:
      - app-logs:/app/logs
      - app-storage:/app/storage
      - app-data:/app/data
      # 让容器内应用管理宿主机 Docker（等价于把 Docker 控制权交给该容器，请限制后台账号权限）
      - /var/run/docker.sock:/var/run/docker.sock
    # Dockerfile 内使用非 root 用户 app；访问 docker.sock 需要 root 或匹配的 docker 组。
    # 这里用 root 保证开箱可用；更严格的环境可改为 group_add: ["${DOCKER_GID}"]。
    user: root
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - tomato-docker

volumes:
  app-logs:
  app-storage:
  app-data:

networks:
  tomato-docker:
    driver: bridge
